services:
  app:
    build: { context: ./backend, dockerfile: Dockerfile.production }
    env_file: ${APP_ENV_FILE:-.env.production}
    restart: unless-stopped
    volumes: [app-storage:/var/www/html/storage]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["${BACKEND_PORT:-8080}:80"]
    volumes: [./infra/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro, ./backend/public:/var/www/html/public:ro, app-storage:/var/www/html/storage:ro]
    depends_on: [app]
  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile.production, args: { VITE_API_BASE_URL: "${VITE_API_BASE_URL:?Set VITE_API_BASE_URL in the production environment}" } }
    restart: unless-stopped
    ports: ["${FRONTEND_PORT:-8081}:80"]
  queue:
    build: { context: ./backend, dockerfile: Dockerfile.production }
    env_file: ${APP_ENV_FILE:-.env.production}
    command: php artisan queue:work --sleep=3 --tries=3 --backoff=10 --max-time=3600
    healthcheck: { test: ["CMD-SHELL", "kill -0 1"], interval: 30s, timeout: 5s, retries: 3 }
    restart: unless-stopped
    volumes: [app-storage:/var/www/html/storage]
    depends_on: [app, redis]
  scheduler:
    build: { context: ./backend, dockerfile: Dockerfile.production }
    env_file: ${APP_ENV_FILE:-.env.production}
    command: php artisan schedule:work
    healthcheck: { test: ["CMD-SHELL", "kill -0 1"], interval: 30s, timeout: 5s, retries: 3 }
    restart: unless-stopped
    volumes: [app-storage:/var/www/html/storage]
    depends_on: [app]
  postgres:
    image: postgres:17-alpine
    env_file: ${APP_ENV_FILE:-.env.production}
    restart: unless-stopped
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 10s, timeout: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    env_file: ${APP_ENV_FILE:-.env.production}
    command: sh -c 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    restart: unless-stopped
    volumes: [redis-data:/data]
    healthcheck: { test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"], interval: 10s, timeout: 5s, retries: 10 }
volumes: { postgres-data: {}, redis-data: {}, app-storage: {} }
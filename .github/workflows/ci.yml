name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eventi_test
          POSTGRES_USER: eventi
          POSTGRES_PASSWORD: eventi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventi -d eventi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, intl, mbstring
      - run: cd backend && composer install --no-interaction --prefer-dist
      - run: cd backend && cp .env.example .env && php artisan key:generate
      - run: cd backend && php artisan migrate --force
      - run: cd backend && ./vendor/bin/pint --test
      - run: cd backend && ./vendor/bin/phpstan analyse --memory-limit=512M
      - run: cd backend && php artisan test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run build
      - run: cd frontend && npm test
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: cd frontend && npm run test:e2e

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd mobile && flutter pub get
      - run: cd mobile && flutter analyze
      - run: cd mobile && flutter test
      - name: Smoke test runtime del target web
        run: cd mobile && sh tool/web_smoke.sh build/web_smoke

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx --yes @redocly/cli lint docs/openapi.yaml

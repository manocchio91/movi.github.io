services:
  app:
    build:
      dockerfile: Dockerfile.e2e
    command: sh -c "test -f .env || cp .env.example .env; grep -qE '^APP_KEY=base64:.+' .env || php artisan key:generate --force; mkdir -p storage/logs bootstrap/cache; touch storage/logs/laravel.log; chown -R www-data:www-data storage bootstrap/cache; php-fpm"
    volumes: !override []
    environment:
      DB_DATABASE: eventi
      FRONTEND_URL: http://127.0.0.1:5174
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5174
  nginx:
    ports: !override
      - "18081:80"
    volumes: !override
      - ./backend:/var/www/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
  frontend:
    ports: !override
      - "5174:5173"
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:18081/api/v1
  postgres:
    ports: !override
      - "55432:5432"
  redis:
    ports: !override
      - "56379:6379"

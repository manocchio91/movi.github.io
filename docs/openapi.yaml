openapi: 3.1.0
info:
  title: MòVi API
  version: 0.2.0
  license: { name: Proprietary, identifier: LicenseRef-Proprietary }
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: get_health
      security: []
      summary: Verifica disponibilità applicazione, database e Redis configurato
      responses:
        "200": { description: "Dipendenze disponibili, senza dettagli sensibili" }
        "429": { description: Troppe richieste }
        "503": { description: Una dipendenza necessaria non è disponibile }
  /auth/register:
    post:
      operationId: post_auth_register
      security: []
      summary: Registra e autentica un customer o un organizer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Utente creato con token Sanctum; per organizer crea anche il profilo pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "422": { description: "Payload non valido, conferma password errata o email duplicata" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /auth/login:
    post:
      operationId: post_auth_login
      security: []
      summary: Login e token Sanctum con role e redirect_to
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Token creato con ruolo, stato profilo Organizer e redirect_to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { description: Credenziali non valide }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /auth/logout:
    post:
      operationId: post_auth_logout
      security: [{ bearerAuth: [] }]
      summary: Revoca il token Sanctum corrente
      responses:
        "200": { description: Logout eseguito }
        "401": { description: Token assente o non valido }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /me:
    get:
      operationId: get_me
      security: [{ bearerAuth: [] }]
      summary: Verifica e ripristina la sessione corrente
      responses:
        "200":
          description: Utente corrente, stato profilo Organizer e redirect_to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "401": { description: "Token assente, revocato o non valido" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /categories:
    get:
      operationId: get_categories
      security: []
      summary: Macroaree evento
      responses:
        "200": { description: Lista categorie }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /events:
    get:
      operationId: get_events
      security: []
      summary: Eventi pubblicati
      parameters:
        - { name: q, in: query, description: Ricerca case-insensitive in titolo e descrizione, schema: { type: string, maxLength: 200 } }
        - { name: category_id, in: query, schema: { type: integer } }
        - { name: province_id, in: query, schema: { type: integer } }
        - { name: municipality_id, in: query, schema: { type: integer } }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: free, in: query, schema: { type: boolean } }
        - { name: available, in: query, schema: { type: boolean } }
      responses:
        "200": { description: Lista paginata dei soli eventi pubblicati futuri; ogni evento include image_url opzionale e bookable_available_total }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /events/{event}:
    get:
      operationId: get_events_event
      security: []
      summary: Dettaglio evento pubblicato
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Evento con canonical_url, image_url opzionale e bookable_available_total; logo_url Organizzatore disponibile come fallback media" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /events/{event}/reviews:
    get:
      operationId: get_events_event_reviews
      security: []
      summary: Recensioni approvate e statistiche evento
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Lista paginata con statistiche recensioni }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      operationId: post_events_event_reviews
      security: [{ bearerAuth: [] }]
      summary: Crea recensione da prenotazione confermata e partecipata
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Recensione creata }
        "403": { description: Prenotazione/partecipazione mancante o organizer proprietario }
        "422": { description: Recensione duplicata o payload non valido }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /reviews/{review}/report:
    post:
      operationId: post_reviews_review_report
      security: [{ bearerAuth: [] }]
      summary: Segnala una recensione
      parameters:
        - { name: review, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Segnalazione aperta }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /subscription-plans:
    get:
      operationId: get_subscription_plans
      security: []
      summary: Piani SaaS disponibili per organizzatori
      responses:
        "200": { description: Lista piani con feature }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /organizers/{organizer}:
    get:
      operationId: get_organizers_organizer
      security: []
      summary: Profilo pubblico organizzatore con esperienze future e concluse
      parameters:
        - { name: organizer, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Profilo pubblico }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /organizers/{organizer}/follow:
    post:
      operationId: post_organizers_organizer_follow
      security: [{ bearerAuth: [] }]
      summary: Segui organizzatore
      parameters:
        - { name: organizer, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Organizzatore seguito }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /events/{event}/waitlist:
    get:
      operationId: get_events_event_waitlist
      security: [{ bearerAuth: [] }]
      summary: Stato e posizione del Customer nella lista d'attesa
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Iscrizione corrente oppure data null }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: post_events_event_waitlist
      security: [{ bearerAuth: [] }]
      summary: Iscrizione idempotente alla lista FIFO di un evento esaurito
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Iscrizione creata o già esistente }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: Evento non esaurito o payload non compatibile }
    delete:
      operationId: delete_events_event_waitlist
      security: [{ bearerAuth: [] }]
      summary: Abbandona la lista o rinuncia all'offerta
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Iscrizione annullata oppure data null }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /events/{event}/waitlist/accept:
    post:
      operationId: post_events_event_waitlist_accept
      security: [{ bearerAuth: [] }]
      summary: Converte una offerta non scaduta in prenotazione idempotente
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Prenotazione confermata }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: Offerta assente o scaduta }
  /events/{event}/share:
    post:
      operationId: post_events_event_share
      security: []
      summary: Registra una azione reale di condivisione dell'evento pubblico
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Evento analytics registrato senza payload personale }
        "404": { description: Evento non pubblico }
        "429": { description: Troppe richieste }
  /customer/organizers/{organizer}/follow:
    post:
      operationId: post_customer_organizers_organizer_follow
      security: [{ bearerAuth: [] }]
      summary: Segue un Organizer verificato in modo idempotente
      parameters:
        - { name: organizer, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Stato follow aggiornato }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Organizer non disponibile }
    delete:
      operationId: delete_customer_organizers_organizer_follow
      security: [{ bearerAuth: [] }]
      summary: Smette di seguire un Organizer in modo idempotente
      parameters:
        - { name: organizer, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Stato follow aggiornato }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /customer/following:
    get:
      operationId: get_customer_following
      security: [{ bearerAuth: [] }]
      summary: Elenco privacy-safe degli Organizer seguiti
      responses:
        "200": { description: Organizer seguiti con soli dati pubblici }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/preferences:
    get:
      operationId: get_me_preferences
      security: [{ bearerAuth: [] }]
      summary: Preferenze macroarea del cliente
      responses:
        "200": { description: Preferenze }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    put:
      operationId: put_me_preferences
      security: [{ bearerAuth: [] }]
      summary: Aggiorna preferenze macroarea
      responses:
        "200": { description: Preferenze aggiornate }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /customer/dashboard:
    get:
      operationId: get_customer_dashboard
      security: [{ bearerAuth: [] }]
      summary: Dashboard cliente protetta da role:customer
      responses:
        "200": { description: "Eventi di successo, eventi futuri, consigliati, booking, preferiti e notifiche" }
        "403": { description: Ruolo non autorizzato }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /customer/successful-events:
    get:
      operationId: get_customer_successful_events
      security: [{ bearerAuth: [] }]
      summary: Eventi di Successo per customer
      parameters:
        - { name: category_id, in: query, schema: { type: integer } }
        - { name: province_id, in: query, schema: { type: integer } }
        - { name: municipality_id, in: query, schema: { type: integer } }
        - { name: min_rating, in: query, schema: { type: number } }
        - { name: organizer_id, in: query, schema: { type: integer } }
        - { name: has_next_edition, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [score, recent, rating, fill_rate, recommended, next_edition] } }
        - { name: per_page, in: query, schema: { type: integer } }
      responses:
        "200": { description: Lista eventi conclusi con dati pubblici e aggregati }
        "403": { description: Solo customer }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /customer/successful-events/{event}:
    get:
      operationId: get_customer_successful_events_event
      security: [{ bearerAuth: [] }]
      summary: Dettaglio pubblico aggregato di un evento concluso di successo
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Dettaglio con recensioni pubbliche, nuova edizione e simili" }
        "404": { description: Evento non ammesso al feed }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /customer/successful-events/{event}/next-editions:
    get:
      operationId: get_customer_successful_events_event_next_editions
      security: [{ bearerAuth: [] }]
      summary: Nuove edizioni future collegate via event_series
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Edizioni future prenotabili se pubblicate }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /customer/successful-events/{event}/similar:
    get:
      operationId: get_customer_successful_events_event_similar
      security: [{ bearerAuth: [] }]
      summary: Eventi futuri simili per categoria e territorio
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Eventi simili deterministici }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /customer/successful-events/{event}/notify-similar:
    post:
      operationId: post_customer_successful_events_event_notify_similar
      security: [{ bearerAuth: [] }]
      summary: Attiva notifiche per format simili
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Preferenza salvata in customer_event_format_interests }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      operationId: delete_customer_successful_events_event_notify_similar
      security: [{ bearerAuth: [] }]
      summary: Disattiva notifiche per format simili
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Preferenza rimossa }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /me/favorites:
    get:
      operationId: get_me_favorites
      security: [{ bearerAuth: [] }]
      summary: Preferiti cliente
      responses:
        "200": { description: Lista preferiti }
        "403": { description: Solo customer }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /me/favorites/{event}:
    post:
      operationId: post_me_favorites_event
      security: [{ bearerAuth: [] }]
      summary: Salva evento tra i preferiti
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Preferito creato }
        "403": { description: Solo customer }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      operationId: delete_me_favorites_event
      security: [{ bearerAuth: [] }]
      summary: Rimuovi evento dai preferiti
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Preferito rimosso }
        "403": { description: Solo customer }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /me/notification-preferences:
    get:
      operationId: get_me_notification_preferences
      security: [{ bearerAuth: [] }]
      summary: Preferenze notifica
      responses:
        "200": { description: Preferenze notifica }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    put:
      operationId: put_me_notification_preferences
      security: [{ bearerAuth: [] }]
      summary: Aggiorna preferenze notifica
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [internal_enabled, email_enabled, promotional_enabled, operational_enabled, followed_organizer_events_enabled, frequency]
              properties:
                internal_enabled: { type: boolean }
                email_enabled: { type: boolean }
                promotional_enabled: { type: boolean }
                operational_enabled: { type: boolean }
                followed_organizer_events_enabled: { type: boolean }
                frequency: { type: string, enum: [immediate, daily, weekly] }
      responses:
        "200": { description: Preferenze aggiornate }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /events/{event}/bookings:
    post:
      operationId: post_events_event_bookings
      security: [{ bearerAuth: [] }]
      summary: Prenota posti per un evento
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, adults_count, items]
              properties:
                phone:
                  type: string
                  pattern: '^\+?[0-9]{7,15}$'
                  description: Numero operativo normalizzato e salvato come dato storico della prenotazione.
                save_phone_to_profile: { type: boolean, default: false, description: Se true aggiorna facoltativamente il telefono del profilo Customer. }
                notes: { type: [string, "null"], maxLength: 1000 }
                adults_count: { type: integer, minimum: 0, maximum: 50 }
                children_count: { type: integer, minimum: 0, maximum: 50 }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [ticket_type_ulid, quantity]
                    properties:
                      ticket_type_ulid: { type: string, minLength: 26, maxLength: 26 }
                      quantity: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "201": { description: "Prenotazione confermata; include qr_token e contact_phone per il Customer proprietario, anche nei retry idempotenti" }
        "401": { description: Autenticazione richiesta }
        "403": { description: Solo Customer }
        "422": { description: Posti non disponibili o richiesta non valida }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /me/bookings:
    get:
      operationId: get_me_bookings
      security: [{ bearerAuth: [] }]
      summary: Prenotazioni del cliente con telefono storico e flag can_edit, can_cancel, can_review calcolati dal backend
      responses:
        "200": { description: Lista prenotazioni }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /me/bookings/{booking}:
    get:
      operationId: get_me_bookings_booking
      security: [{ bearerAuth: [] }]
      summary: Dettaglio prenotazione cliente, incluso il telefono storico
      parameters:
        - { name: booking, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Prenotazione }
        "403": { description: Prenotazione altrui }
        "500": { $ref: "#/components/responses/InternalServerError" }
    patch:
      operationId: patch_me_bookings_booking
      security: [{ bearerAuth: [] }]
      summary: Modifica ticket, quantità, telefono e note di una prenotazione Customer
      description: Aggiorna atomicamente disponibilità evento e contingenti ticket senza cambiare prenotazione, codice o QR.
      parameters:
        - { name: booking, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, adults_count, items]
              properties:
                phone: { type: string, pattern: '^\+?[0-9]{7,15}$' }
                save_phone_to_profile: { type: boolean, default: false }
                notes: { type: [string, "null"], maxLength: 1000 }
                adults_count: { type: integer, minimum: 0, maximum: 50 }
                children_count: { type: integer, minimum: 0, maximum: 50 }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [ticket_type_ulid, quantity]
                    properties:
                      ticket_type_ulid: { type: string, minLength: 26, maxLength: 26 }
                      quantity: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200": { description: Prenotazione modificata; QR invariato }
        "403": { description: Prenotazione altrui }
        "422": { description: Prenotazione non modificabile o disponibilità insufficiente }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /me/bookings/{booking}/qr:
    get:
      operationId: get_me_bookings_booking_qr
      security: [{ bearerAuth: [] }]
      summary: Recupera il token QR persistente della prenotazione Customer
      description: Il token resta recuperabile dopo il check-in, ma non può essere riutilizzato. Hash e ciphertext non sono mai esposti.
      parameters:
        - { name: booking, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Token QR della prenotazione
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [booking_ulid, qr_token]
                    properties:
                      booking_ulid: { type: string }
                      qr_token: { type: string, minLength: 32 }
        "401": { description: Autenticazione richiesta }
        "403": { description: Prenotazione altrui o ruolo non Customer }
        "404": { description: Prenotazione non trovata }
        "409": { description: Booking legacy senza token QR recuperabile }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /me/bookings/{booking}/cancel:
    post:
      operationId: post_me_bookings_booking_cancel
      security: [{ bearerAuth: [] }]
      summary: Annulla prenotazione e libera posti
      parameters:
        - { name: booking, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Prenotazione annullata }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /me/notifications:
    get:
      operationId: get_me_notifications
      security: [{ bearerAuth: [] }]
      summary: Centro notifiche
      responses:
        "200": { description: Lista notifiche }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /me/notifications/{notification}/read:
    post:
      operationId: post_me_notifications_notification_read
      security: [{ bearerAuth: [] }]
      summary: Marca una notifica come letta
      parameters:
        - { name: notification, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Notifica letta }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /me/notifications/read-all:
    post:
      operationId: post_me_notifications_read_all
      security: [{ bearerAuth: [] }]
      summary: Marca tutte le notifiche come lette
      responses:
        "200": { description: Notifiche lette }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /organizer/profile:
    get:
      operationId: get_organizer_profile
      security: [{ bearerAuth: [] }]
      summary: Profilo fiscale e pubblico dell'Organizer autenticato
      responses:
        "200": { description: Profilo }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    patch:
      operationId: patch_organizer_profile
      security: [{ bearerAuth: [] }]
      summary: Salva il profilo iniziale oppure invia modifiche di un profilo verificato in approvazione
      requestBody:
        required: true

      responses: { "200": { description: DisponibilitÃ  configurata }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
  /organizer/activities/{activity}/reservations:
    parameters: [ { name: activity, in: path, required: true, schema: { type: string } } ]
    get:
      operationId: get_organizer_activity_reservations
      summary: Elenca Reservation dell'Activity
      responses: { "200": { description: Reservation ricevute }, "403": { $ref: "#/components/responses/Forbidden" } }
  /organizer/reservations/{reservation}/cancel:
    parameters: [ { name: reservation, in: path, required: true, schema: { type: string } } ]
    post:
      operationId: post_organizer_reservation_cancel
      summary: Cancella Reservation dell'Activity gestita
      responses: { "200": { description: Reservation cancellata }, "403": { $ref: "#/components/responses/Forbidden" } }
  /organizer/reservations:
    get:
      operationId: get_organizer_reservations
      summary: Lista operativa Reservation con filtri per data, stato, Activity, Service e cliente
      responses: { "200": { description: Reservation gestite }, "403": { $ref: "#/components/responses/Forbidden" } }
  /organizer/reservations/dashboard:
    get:
      operationId: get_organizer_reservation_dashboard
      summary: Dashboard reale di prenotazioni, coperti, capacita e criticita
      responses: { "200": { description: Riepilogo operativo }, "403": { $ref: "#/components/responses/Forbidden" } }
  /organizer/reservations/customers:
    get:
      operationId: get_organizer_reservation_customers
      summary: Riepilogo clienti minimizzato e privacy-safe
      responses: { "200": { description: Clienti aggregati }, "403": { $ref: "#/components/responses/Forbidden" } }
  /organizer/reservations/analytics:
    get:
      operationId: get_organizer_reservation_analytics
      summary: KPI operativi reali delle Reservation
      responses: { "200": { description: Analytics Reservation }, "403": { $ref: "#/components/responses/Forbidden" } }
  /organizer/reservations/{reservation}:
    parameters: [ { name: reservation, in: path, required: true, schema: { type: string } } ]
    get:
      operationId: get_organizer_reservation
      summary: Dettaglio operativo Reservation
      responses: { "200": { description: Reservation }, "403": { $ref: "#/components/responses/Forbidden" } }
  /organizer/reservations/{reservation}/status:
    parameters: [ { name: reservation, in: path, required: true, schema: { type: string } } ]
    patch:
      operationId: patch_organizer_reservation_status
      summary: Marca una Reservation conclusa come completed o no_show
      responses: { "200": { description: Stato aggiornato }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
  /discovery:
    get:
      operationId: get_discovery
      summary: Discovery deterministica di Event e Activity realmente disponibili
      parameters:
        - { name: when, in: query, schema: { type: string, enum: [today, evening, tomorrow, weekend] } }
        - { name: type, in: query, schema: { type: string, enum: [all, event, activity] } }
        - { name: category_id, in: query, schema: { type: integer } }
        - { name: latitude, in: query, schema: { type: number } }
        - { name: longitude, in: query, schema: { type: number } }
        - { name: radius_km, in: query, schema: { type: number, maximum: 200 } }
      responses: { "200": { description: Risultati normalizzati e paginati }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
  /recommendations:
    get:
      operationId: get_recommendations
      summary: Feed deterministico con motivazioni trasparenti
      responses: { "200": { description: Risultati ordinati con recommendation_reasons }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
  /recommendations/opened:
    post:
      operationId: post_recommendation_opened
      summary: Registra apertura deduplicata di un risultato raccomandato
      responses: { "200": { description: Apertura registrata }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
  /plans/generate:
    post:
      operationId: post_plans_generate
      summary: Genera fino a tre piani deterministici da Event e Activity reali
      responses: { "200": { description: Piani temporanei ordinati e motivati }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
  /plans/revalidate:
    post:
      operationId: post_plans_revalidate
      summary: Rivalida disponibilità reale di tutti gli step di un piano
      responses: { "200": { description: Stato di ogni step e lista indisponibili }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
  /plans/interaction:
    post:
      operationId: post_plans_interaction
      summary: Registra apertura piano o step senza PII
      responses: { "200": { description: Interazione registrata }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
  /ai/plan:
    post:
      operationId: post_ai_plan
      summary: Interpreta testo non fidato in un intento strutturato e invoca MòVi Plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 1000 }
                previous_intent: { type: [object, "null"] }
      responses: { "200": { description: Intento interpretato e piani reali con disponibilità verificata }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
  /activities/{activity}/menu:
    get:
      operationId: get_activity_published_menu
      summary: Restituisce esclusivamente il menu pubblicato dell'Activity
      parameters: [{ name: activity, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Menu digitale pubblicato }, "404": { description: Nessun menu pubblicato } }
  /organizer/activities/{activity}/menus/import:
    post:
      operationId: post_organizer_menu_import
      summary: Importa XLSX o DOCX in una bozza da revisionare
      parameters: [{ name: activity, in: path, required: true, schema: { type: string } }]
      responses: { "201": { description: Bozza e report import }, "403": { description: Activity non posseduta }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
  /organizer/activities/{activity}/menus:
    parameters: [{ name: activity, in: path, required: true, schema: { type: string } }]
    get:
      operationId: get_organizer_activity_menus
      summary: Elenca menu, sezioni e piatti dell'Activity posseduta
      responses: { "200": { description: Menu gestibili }, "403": { $ref: "#/components/responses/Forbidden" } }
    post:
      operationId: post_organizer_activity_menu
      summary: Crea un menu in bozza
      responses: { "201": { description: Menu creato }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
  /organizer/activities/{activity}/menus/{menu}:
    parameters: [{ name: activity, in: path, required: true, schema: { type: string } }, { name: menu, in: path, required: true, schema: { type: string } }]
    put:
      operationId: put_organizer_activity_menu
      summary: Aggiorna il menu posseduto
      responses: { "200": { description: Menu aggiornato }, "403": { $ref: "#/components/responses/Forbidden" } }
    delete:
      operationId: delete_organizer_activity_menu
      summary: Elimina un menu non più necessario
      responses: { "204": { description: Menu eliminato }, "403": { $ref: "#/components/responses/Forbidden" } }
  /organizer/activities/{activity}/menus/{menu}/sections:
    post:
      operationId: post_organizer_menu_section
      summary: Aggiunge una sezione ordinata
      parameters: [{ name: activity, in: path, required: true, schema: { type: string } }, { name: menu, in: path, required: true, schema: { type: string } }]
      responses: { "201": { description: Sezione creata }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
  /organizer/activities/{activity}/menus/{menu}/sections/{section}:
    parameters: [{ name: activity, in: path, required: true, schema: { type: string } }, { name: menu, in: path, required: true, schema: { type: string } }, { name: section, in: path, required: true, schema: { type: string } }]
    put:
      operationId: put_organizer_menu_section
      summary: Aggiorna nome e ordinamento sezione
      responses: { "200": { description: Sezione aggiornata }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
    delete:
      operationId: delete_organizer_menu_section
      summary: Elimina la sezione
      responses: { "204": { description: Sezione eliminata }, "403": { $ref: "#/components/responses/Forbidden" } }
  /organizer/activities/{activity}/menus/{menu}/sections/{section}/items:
    post:
      operationId: post_organizer_menu_item
      summary: Aggiunge un piatto con prezzo e allergeni dichiarati
      parameters: [{ name: activity, in: path, required: true, schema: { type: string } }, { name: menu, in: path, required: true, schema: { type: string } }, { name: section, in: path, required: true, schema: { type: string } }]
      responses: { "201": { description: Piatto creato }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
  /organizer/activities/{activity}/menus/{menu}/items/{item}:
    parameters: [{ name: activity, in: path, required: true, schema: { type: string } }, { name: menu, in: path, required: true, schema: { type: string } }, { name: item, in: path, required: true, schema: { type: string } }]
    put:
      operationId: put_organizer_menu_item
      summary: Aggiorna piatto, disponibilità e ordinamento
      responses: { "200": { description: Piatto aggiornato }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
    delete:
      operationId: delete_organizer_menu_item
      summary: Elimina il piatto
      responses: { "204": { description: Piatto eliminato }, "403": { $ref: "#/components/responses/Forbidden" } }
  /organizer/activities/{activity}/menus/{menu}/publish:
    post:
      operationId: post_organizer_menu_publish
      summary: Pubblica una bozza revisionata
      parameters: [{ name: activity, in: path, required: true, schema: { type: string } }, { name: menu, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Menu pubblicato }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
  /organizer/activities/{activity}/menus/{menu}/unpublish:
    post:
      operationId: post_organizer_menu_unpublish
      summary: Riporta il menu in bozza
      parameters: [{ name: activity, in: path, required: true, schema: { type: string } }, { name: menu, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Menu in bozza }, "403": { $ref: "#/components/responses/Forbidden" } }
  /me/reservations/{reservation}/preorder:
    parameters: [{ name: reservation, in: path, required: true, schema: { type: string } }]
    get:
      operationId: get_reservation_preorder
      summary: Legge il preordine della prenotazione autorizzata
      responses: { "200": { description: Preordine con snapshot }, "404": { description: Preordine assente } }
    put:
      operationId: put_reservation_preorder
      summary: Conferma o aggiorna un preordine entro la deadline
      responses: { "200": { description: Preordine confermato; pagamento al locale }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
  /me/reservations/{reservation}/preorder/cancel:
    post:
      operationId: post_reservation_preorder_cancel
      summary: Cancella il preordine autorizzato entro la deadline
      parameters: [{ name: reservation, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Preordine cancellato }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
components:
  schemas:
    ErrorResponse:
      type: object
      required: [message, errors, request_id]
      properties:
        message: { type: string }
        errors: { type: object, additionalProperties: true }
        request_id: { type: [string, "null"] }
    CustomerProfileUpdate:
      type: object
      required: [name, email]
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email, maxLength: 255 }
        phone: { type: [string, "null"], pattern: "^\\+?[0-9]{7,15}$" }
    PasswordUpdate:
      type: object
      required: [current_password, password, password_confirmation]
      properties:
        current_password: { type: string, format: password }
        password: { type: string, format: password, minLength: 8 }
        password_confirmation: { type: string, format: password, minLength: 8 }
    AdminPlanWrite:
      type: object
      required: [name, billing_model, billing_interval, monthly_price_cents, booking_fee_cents, is_active]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 1000 }
        billing_model: { type: string, enum: [unlimited, pay_per_booking] }
        billing_interval: { type: string, enum: [monthly, yearly] }
        monthly_price_cents: { type: integer, minimum: 0 }
        booking_fee_cents: { type: integer, minimum: 0 }
        is_active: { type: boolean }
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, format: password, minLength: 8 }
        password_confirmation: { type: string, format: password, minLength: 8 }
        role: { type: string, enum: [customer, organizer], default: customer }
        organization_name:
          type: string
          maxLength: 180
          description: Obbligatorio quando role e organizer.
        organization_type:
          type: string
          maxLength: 80
          description: Obbligatorio quando role e organizer.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    AuthUser:
      type: object
      required: [name, email, role, status, organizer_profile]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [customer, organizer, admin] }
        status: { type: string, enum: [active, pending, suspended] }
        organizer_profile:
          oneOf:
            - type: "null"
            - type: object
              required: [ulid, name, verification_status]
              properties:
                ulid: { type: string }
                name: { type: string }
                verification_status: { $ref: "#/components/schemas/OrganizerVerificationStatus" }
                review_notes: { type: [string, "null"] }
    AuthResponse:
      type: object
      required: [user, token, redirect_to]
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }
        token: { type: string, description: Personal access token Sanctum opaco. }
        redirect_to: { type: string, enum: [/customer/dashboard, /organizer/onboarding, /organizer/pending, /organizer/dashboard, /organizer/rejected, /organizer/suspended, /admin/dashboard] }
    SessionResponse:
      type: object
      required: [user, redirect_to]
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }
        redirect_to: { type: string, enum: [/customer/dashboard, /organizer/onboarding, /organizer/pending, /organizer/dashboard, /organizer/rejected, /organizer/suspended, /admin/dashboard] }
    OrganizerVerificationStatus:
      type: string
      enum: [incomplete, pending, changes_requested, verified, rejected, suspended]
    OrganizerProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: [string, "null"], maxLength: 180 }
        type: { type: [string, "null"], maxLength: 80 }
        description: { type: [string, "null"], maxLength: 3000 }
        municipality_id: { type: [integer, "null"] }
        address: { type: [string, "null"], maxLength: 255 }
        street_number: { type: [string, "null"], maxLength: 20 }
        postal_code: { type: [string, "null"], pattern: "^[0-9]{5}$" }
        province: { type: [string, "null"], pattern: "^[A-Z]{2}$" }
        country: { type: [string, "null"], maxLength: 80 }
        vat_number: { type: [string, "null"], pattern: "^(IT)?[0-9]{11}$" }
        pec: { type: [string, "null"], format: email }
        sdi_code: { type: [string, "null"], pattern: "^[A-Za-z0-9]{7}$" }
        phone: { type: [string, "null"], maxLength: 40 }
        public_email: { type: [string, "null"], format: email }
        website_url: { type: [string, "null"], format: uri }
        instagram_url: { type: [string, "null"], format: uri }
        facebook_url: { type: [string, "null"], format: uri }
        tiktok_url: { type: [string, "null"], format: uri }
    OrganizerReviewReason:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }
    OrganizerEventListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            required: [event, summary]
            properties:
              event:
                type: object
                required: [ulid, title, status, starts_at, capacity_total, available_total]
                additionalProperties: true
                properties:
                  ulid: { type: string }
                  title: { type: string }
                  status: { type: string, enum: [draft, pending_review, published, sold_out, cancelled, completed, rejected, suspended, archived] }
                  starts_at: { type: string, format: date-time }
                  capacity_total: { type: integer, minimum: 0 }
                  available_total: { type: integer, minimum: 0 }
              summary:
                type: object
                required: [ulid, title, status, visual_status, starts_at, capacity_total, booked_people, available_total, capacity_available_total, checked_in_people, no_show]
                additionalProperties: true
                properties:
                  ulid: { type: string }
                  title: { type: string }
                  status: { type: string, enum: [draft, pending_review, published, sold_out, cancelled, completed, rejected, suspended, archived] }
                  visual_status: { type: string }
                  starts_at: { type: string, format: date-time }
                  capacity_total: { type: integer, minimum: 0 }
                  booked_people: { type: integer, minimum: 0 }
                  available_total: { type: integer, minimum: 0, description: Posti realmente prenotabili limitati dai ticket attivi e dalla capienza globale }
                  capacity_available_total: { type: integer, minimum: 0, description: Residuo della sola capienza globale }
                  checked_in_people: { type: integer, minimum: 0 }
                  no_show: { type: integer, minimum: 0 }
        meta:
          type: object
          required: [current_page, last_page, per_page, total, from, to]
          properties:
            current_page: { type: integer, minimum: 1 }
            last_page: { type: integer, minimum: 1 }
            per_page: { type: integer, minimum: 1, maximum: 50 }
            total: { type: integer, minimum: 0 }
            from: { type: [integer, "null"], minimum: 1 }
            to: { type: [integer, "null"], minimum: 1 }
    OrganizerEventTicketWrite:
      type: object
      required: [name, audience, price_cents, max_quantity]
      properties:
        ulid:
          type: string
          description: Presente soltanto per un ticket esistente durante l'update; deve appartenere all'evento.
        name: { type: string, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 500 }
        audience: { type: string, enum: [adult, child, generic] }
        price_cents: { type: integer, minimum: 0 }
        max_quantity: { type: integer, minimum: 1, maximum: 10000 }
        is_active: { type: boolean, default: true }
    OrganizerEventWriteRequest:
      type: object
      required: [title, summary, description, municipality_id, category_ids, starts_at, capacity_total, is_free, family_friendly, indoor_outdoor]
      properties:
        title: { type: string, maxLength: 180 }
        summary: { type: string, maxLength: 280 }
        description: { type: string, maxLength: 8000 }
        municipality_id: { type: integer }
        category_ids:
          type: array
          minItems: 1
          items: { type: integer }
        starts_at: { type: string, format: date-time, description: Deve essere futura. }
        ends_at: { type: [string, "null"], format: date-time, description: Se presente deve essere successiva a starts_at. }
        booking_closes_at: { type: [string, "null"], format: date-time }
        capacity_total: { type: integer, minimum: 1, maximum: 10000 }
        is_free: { type: boolean }
        price_notes: { type: [string, "null"], maxLength: 500 }
        family_friendly: { type: boolean }
        indoor_outdoor: { type: string, enum: [indoor, outdoor, mixed] }
        ticket_types:
          type: array
          minItems: 1
          description: Se omesso in update, i ticket esistenti restano invariati. Un ticket omesso viene rimosso solo se booked_quantity è zero.
          items: { $ref: "#/components/schemas/OrganizerEventTicketWrite" }
    OrganizerEventTicket:
      allOf:
        - $ref: "#/components/schemas/OrganizerEventTicketWrite"
        - type: object
          required: [ulid, booked_quantity]
          properties:
            ulid: { type: string }
            booked_quantity: { type: integer, minimum: 0, readOnly: true }
    OrganizerEventResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [ulid, title, summary, description, status, starts_at, capacity_total, available_total, categories, ticket_types]
          additionalProperties: true
          properties:
            ulid: { type: string }
            title: { type: string }
            summary: { type: string }
            description: { type: string }
            status: { type: string, enum: [draft, pending_review, published, sold_out, cancelled, completed, rejected, suspended, archived] }
            starts_at: { type: string, format: date-time }
            ends_at: { type: [string, "null"], format: date-time }
            capacity_total: { type: integer, minimum: 1 }
            available_total: { type: integer, minimum: 0 }
            categories:
              type: array
              items: { type: object, additionalProperties: true }
            ticket_types:
              type: array
              items: { $ref: "#/components/schemas/OrganizerEventTicket" }
    OrganizerDashboardResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/OrganizerDashboardData"
    OrganizerDashboardData:
      type: object
      required: [subscription, bi, category_performance, active_experiences, future_experiences, completed_experiences, unpublished_experiences, bookings_total, available_places, participants_total, views_total, favorites_received, followers, reviews]
      properties:
        subscription:
          type: [object, "null"]
          description: Abbonamento Organizer con piano e funzionalita, oppure null.
          additionalProperties: true
        bi:
          $ref: "#/components/schemas/OrganizerDashboardBi"
        category_performance:
          type: array
          items:
            $ref: "#/components/schemas/OrganizerCategoryPerformance"
        active_experiences:
          type: integer
          minimum: 0
          description: Eventi operativi futuri; coincide con future_experiences.
        future_experiences: { type: integer, minimum: 0 }
        completed_experiences: { type: integer, minimum: 0 }
        unpublished_experiences: { type: integer, minimum: 0 }
        bookings_total:
          type: integer
          minimum: 0
          description: Booking valide ricevute; coincide con bi.bookings_received.
        available_places: { type: integer, minimum: 0 }
        participants_total:
          type: integer
          minimum: 0
          description: Somma di total_people delle booking valide.
        views_total: { type: integer, minimum: 0 }
        favorites_received: { type: integer, minimum: 0 }
        followers: { type: integer, minimum: 0 }
        reviews: { type: integer, minimum: 0 }
    OrganizerDashboardBi:
      type: object
      required: [published_events, future_events, completed_events, unpublished_events, cancelled_events, sold_out_events, available_places, occupied_places, bookings_received, participants_total, unique_participants, returning_participants, returning_rate, new_customers_rate, followers_total, new_followers, reviews, average_rating, review_analytics, views_total]
      properties:
        published_events: { type: integer, minimum: 0 }
        future_events:
          type: integer
          minimum: 0
          description: Eventi published o sold_out con starts_at maggiore o uguale a now.
        completed_events:
          type: integer
          minimum: 0
          description: Eventi con status completed.
        unpublished_events:
          type: integer
          minimum: 0
          description: Eventi draft, pending_review, rejected, suspended o archived.
        cancelled_events: { type: integer, minimum: 0 }
        sold_out_events: { type: integer, minimum: 0 }
        available_places:
          type: integer
          minimum: 0
          description: Posti disponibili degli eventi operativi futuri.
        occupied_places:
          type: integer
          minimum: 0
          description: Capacita meno disponibilita degli eventi operativi futuri.
        bookings_received:
          type: integer
          minimum: 0
          description: Booking confirmed, checked_in o completed ricevute.
        participants_total:
          type: integer
          minimum: 0
          description: Somma di bookings.total_people delle booking valide.
        unique_participants: { type: integer, minimum: 0 }
        returning_participants: { type: integer, minimum: 0 }
        returning_rate: { type: number, minimum: 0, maximum: 100 }
        new_customers_rate: { type: number, minimum: 0, maximum: 100 }
        followers_total: { type: integer, minimum: 0 }
        new_followers: { type: integer, minimum: 0 }
        reviews: { type: integer, minimum: 0 }
        average_rating: { type: [number, "null"] }
        review_analytics:
          $ref: "#/components/schemas/OrganizerReviewAnalytics"
        views_total: { type: integer, minimum: 0 }
    OrganizerReviewAnalytics:
      type: object
      required: [average_rating, reviews_count, satisfied_rate, recommendation_rate, trend, best_categories]
      properties:
        average_rating: { type: [number, "null"] }
        reviews_count: { type: integer, minimum: 0 }
        satisfied_rate: { type: number, minimum: 0, maximum: 100 }
        recommendation_rate: { type: number, minimum: 0, maximum: 100 }
        trend:
          type: array
          items:
            type: object
            required: [day, reviews_count, average_rating]
            properties:
              day: { type: string, format: date }
              reviews_count: { type: integer, minimum: 0 }
              average_rating: { type: number }
        best_categories:
          type: array
          items:
            type: object
            required: [name, reviews_count, average_rating]
            properties:
              name: { type: string }
              reviews_count: { type: integer, minimum: 0 }
              average_rating: { type: number }
    OrganizerCategoryPerformance:
      type: object
      required: [name, events_count, bookings_count, avg_participants, fill_rate]
      properties:
        name: { type: string }
        events_count: { type: integer, minimum: 0 }
        bookings_count: { type: integer, minimum: 0 }
        avg_participants: { type: number, minimum: 0 }
        fill_rate: { type: number, minimum: 0 }
  responses:
    BadRequest: { description: Richiesta non valida, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    Unauthorized: { description: Autenticazione richiesta o token non valido, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    Forbidden: { description: Operazione non autorizzata, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    NotFound: { description: Risorsa non trovata, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    Conflict: { description: Conflitto con lo stato corrente, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    UnprocessableEntity: { description: Dati non validi, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    InternalServerError: { description: Errore interno generico e sicuro, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Personal access token opaco emesso da Laravel Sanctum. Non è un JWT.

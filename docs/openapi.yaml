openapi: 3.1.0
info:
  title: Eventi Locali API
  version: 0.2.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /auth/register:
    post:
      summary: Registra e autentica un customer o un organizer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Utente creato con token Sanctum; per organizer crea anche il profilo pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "422": { description: Payload non valido, conferma password errata o email duplicata }
  /auth/login:
    post:
      summary: Login e token Sanctum con role e redirect_to
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Token creato con ruolo, stato profilo Organizer e redirect_to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "422": { description: Credenziali non valide }
  /auth/logout:
    post:
      security: [{ bearerAuth: [] }]
      summary: Revoca il token Sanctum corrente
      responses:
        "200": { description: Logout eseguito }
        "401": { description: Token assente o non valido }
  /me:
    get:
      security: [{ bearerAuth: [] }]
      summary: Verifica e ripristina la sessione corrente
      responses:
        "200":
          description: Utente corrente, stato profilo Organizer e redirect_to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "401": { description: Token assente, revocato o non valido }
  /categories:
    get:
      summary: Macroaree evento
      responses:
        "200": { description: Lista categorie }
  /events:
    get:
      summary: Eventi pubblicati
      parameters:
        - { name: q, in: query, description: Ricerca case-insensitive in titolo e descrizione, schema: { type: string, maxLength: 200 } }
        - { name: category_id, in: query, schema: { type: integer } }
        - { name: province_id, in: query, schema: { type: integer } }
        - { name: municipality_id, in: query, schema: { type: integer } }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: free, in: query, schema: { type: boolean } }
        - { name: available, in: query, schema: { type: boolean } }
      responses:
        "200": { description: Lista paginata }
  /events/{event}:
    get:
      summary: Dettaglio evento pubblicato
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Evento }
  /events/{event}/reviews:
    get:
      summary: Recensioni approvate e statistiche evento
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Lista paginata con statistiche recensioni }
    post:
      security: [{ bearerAuth: [] }]
      summary: Crea recensione da prenotazione confermata e partecipata
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Recensione creata }
        "403": { description: Prenotazione/partecipazione mancante o organizer proprietario }
        "422": { description: Recensione duplicata o payload non valido }
  /reviews/{review}/report:
    post:
      security: [{ bearerAuth: [] }]
      summary: Segnala una recensione
      parameters:
        - { name: review, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Segnalazione aperta }
  /subscription-plans:
    get:
      summary: Piani SaaS disponibili per organizzatori
      responses:
        "200": { description: Lista piani con feature }
  /organizers/{organizer}:
    get:
      summary: Profilo pubblico organizzatore con esperienze future e concluse
      parameters:
        - { name: organizer, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Profilo pubblico }
  /organizers/{organizer}/follow:
    post:
      security: [{ bearerAuth: [] }]
      summary: Segui organizzatore
      parameters:
        - { name: organizer, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Organizzatore seguito }
    delete:
      security: [{ bearerAuth: [] }]
      summary: Smetti di seguire organizzatore
      parameters:
        - { name: organizer, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Follow rimosso }
  /me/preferences:
    get:
      security: [{ bearerAuth: [] }]
      summary: Preferenze macroarea del cliente
      responses:
        "200": { description: Preferenze }
    put:
      security: [{ bearerAuth: [] }]
      summary: Aggiorna preferenze macroarea
      responses:
        "200": { description: Preferenze aggiornate }
  /customer/dashboard:
    get:
      security: [{ bearerAuth: [] }]
      summary: Dashboard cliente protetta da role:customer
      responses:
        "200": { description: Eventi di successo, eventi futuri, consigliati, booking, preferiti e notifiche }
        "403": { description: Ruolo non autorizzato }
  /customer/successful-events:
    get:
      security: [{ bearerAuth: [] }]
      summary: Eventi di Successo per customer
      parameters:
        - { name: category_id, in: query, schema: { type: integer } }
        - { name: province_id, in: query, schema: { type: integer } }
        - { name: municipality_id, in: query, schema: { type: integer } }
        - { name: min_rating, in: query, schema: { type: number } }
        - { name: organizer_id, in: query, schema: { type: integer } }
        - { name: has_next_edition, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [score, recent, rating, fill_rate, recommended, next_edition] } }
        - { name: per_page, in: query, schema: { type: integer } }
      responses:
        "200": { description: Lista eventi conclusi con dati pubblici e aggregati }
        "403": { description: Solo customer }
  /customer/successful-events/{event}:
    get:
      security: [{ bearerAuth: [] }]
      summary: Dettaglio pubblico aggregato di un evento concluso di successo
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Dettaglio con recensioni pubbliche, nuova edizione e simili }
        "404": { description: Evento non ammesso al feed }
  /customer/successful-events/{event}/next-editions:
    get:
      security: [{ bearerAuth: [] }]
      summary: Nuove edizioni future collegate via event_series
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Edizioni future prenotabili se pubblicate }
  /customer/successful-events/{event}/similar:
    get:
      security: [{ bearerAuth: [] }]
      summary: Eventi futuri simili per categoria e territorio
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Eventi simili deterministici }
  /customer/successful-events/{event}/notify-similar:
    post:
      security: [{ bearerAuth: [] }]
      summary: Attiva notifiche per format simili
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Preferenza salvata in customer_event_format_interests }
    delete:
      security: [{ bearerAuth: [] }]
      summary: Disattiva notifiche per format simili
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Preferenza rimossa }
  /me/favorites:
    get:
      security: [{ bearerAuth: [] }]
      summary: Preferiti cliente
      responses:
        "200": { description: Lista preferiti }
        "403": { description: Solo customer }
  /me/favorites/{event}:
    post:
      security: [{ bearerAuth: [] }]
      summary: Salva evento tra i preferiti
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Preferito creato }
        "403": { description: Solo customer }
    delete:
      security: [{ bearerAuth: [] }]
      summary: Rimuovi evento dai preferiti
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Preferito rimosso }
        "403": { description: Solo customer }
  /me/notification-preferences:
    get:
      security: [{ bearerAuth: [] }]
      summary: Preferenze notifica
      responses:
        "200": { description: Preferenze notifica }
    put:
      security: [{ bearerAuth: [] }]
      summary: Aggiorna preferenze notifica
      responses:
        "200": { description: Preferenze aggiornate }
  /events/{event}/bookings:
    post:
      security: [{ bearerAuth: [] }]
      summary: Prenota posti per un evento
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      responses:
        "201": { description: Prenotazione confermata; include qr_token, anche nei retry idempotenti }
        "401": { description: Autenticazione richiesta }
        "403": { description: Solo Customer }
        "422": { description: Posti non disponibili o richiesta non valida }
  /me/bookings:
    get:
      security: [{ bearerAuth: [] }]
      summary: Prenotazioni del cliente
      responses:
        "200": { description: Lista prenotazioni }
  /me/bookings/{booking}:
    get:
      security: [{ bearerAuth: [] }]
      summary: Dettaglio prenotazione cliente
      parameters:
        - { name: booking, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Prenotazione }
        "403": { description: Prenotazione altrui }
  /me/bookings/{booking}/qr:
    get:
      security: [{ bearerAuth: [] }]
      summary: Recupera il token QR persistente della prenotazione Customer
      description: Il token resta recuperabile dopo il check-in, ma non può essere riutilizzato. Hash e ciphertext non sono mai esposti.
      parameters:
        - { name: booking, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Token QR della prenotazione
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [booking_ulid, qr_token]
                    properties:
                      booking_ulid: { type: string }
                      qr_token: { type: string, minLength: 32 }
        "401": { description: Autenticazione richiesta }
        "403": { description: Prenotazione altrui o ruolo non Customer }
        "404": { description: Prenotazione non trovata }
        "409": { description: Booking legacy senza token QR recuperabile }
  /me/bookings/{booking}/cancel:
    post:
      security: [{ bearerAuth: [] }]
      summary: Annulla prenotazione e libera posti
      parameters:
        - { name: booking, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Prenotazione annullata }
  /me/notifications:
    get:
      security: [{ bearerAuth: [] }]
      summary: Centro notifiche
      responses:
        "200": { description: Lista notifiche }
  /me/notifications/{notification}/read:
    post:
      security: [{ bearerAuth: [] }]
      summary: Marca una notifica come letta
      parameters:
        - { name: notification, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Notifica letta }
  /me/notifications/read-all:
    post:
      security: [{ bearerAuth: [] }]
      summary: Marca tutte le notifiche come lette
      responses:
        "200": { description: Notifiche lette }
  /organizer/profile:
    get:
      security: [{ bearerAuth: [] }]
      summary: Profilo fiscale e pubblico dell'Organizer autenticato
      responses:
        "200": { description: Profilo }
    patch:
      security: [{ bearerAuth: [] }]
      summary: Salva parzialmente il profilo Organizer modificabile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizerProfileUpdate" }
      responses:
        "200": { description: Profilo aggiornato }
        "409": { description: Profilo non modificabile nello stato corrente }
        "422": { description: Dati non validi }
  /organizer/profile/submit:
    post:
      security: [{ bearerAuth: [] }]
      summary: Invia il profilo fiscale completo all'approvazione Admin
      responses:
        "200": { description: Profilo passato allo stato pending con submitted_at valorizzato }
        "409": { description: Transizione non valida }
        "422": { description: Dati fiscali obbligatori incompleti o non validi }
  /organizer/dashboard:
    get:
      security: [{ bearerAuth: [] }]
      summary: Dashboard SaaS organizzatore protetta da role:organizer e organizer.approved
      description: >-
        I KPI di prenotazioni e partecipanti considerano valide esclusivamente le booking
        confirmed, checked_in e completed. participants_total e la somma di total_people
        delle booking valide. future_events comprende eventi published o sold_out con
        starts_at maggiore o uguale all'istante corrente; completed_events comprende solo
        eventi con status completed; unpublished_events comprende draft, pending_review,
        rejected, suspended e archived.
      responses:
        "200":
          description: KPI subscription, esperienze, prenotazioni, follower e views
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizerDashboardResponse"
        "401": { description: Token Sanctum assente o non valido }
        "403": { description: Organizer non approvato o ruolo errato }
  /organizer/reviews:
    get:
      security: [{ bearerAuth: [] }]
      summary: Recensioni del profilo organizzatore
      responses:
        "200": { description: Statistiche, distribuzione stelle, recensioni recenti, migliori e critiche }
  /organizer/statistics:
    get:
      security: [{ bearerAuth: [] }]
      summary: KPI business intelligence organizzatore
      responses:
        "200": { description: KPI e performance categorie }
  /organizer/analytics:
    get:
      security: [{ bearerAuth: [] }]
      summary: Eventi analytics recenti
      responses:
        "200": { description: Lista analytics events }
  /organizer/followers:
    get:
      security: [{ bearerAuth: [] }]
      summary: Utenti che seguono il locale
      responses:
        "200": { description: Lista follower }
  /organizer/categories:
    get:
      security: [{ bearerAuth: [] }]
      summary: Performance categorie
      responses:
        "200": { description: Categoria, eventi, prenotazioni, fill rate }
  /organizer/opportunities:
    get:
      security: [{ bearerAuth: [] }]
      summary: Organizer Opportunity Engine
      responses:
        "200": { description: Concorrenza, suggerimenti AI/fallback e top events aggregati }
  /organizer/opportunities/generate:
    post:
      security: [{ bearerAuth: [] }]
      summary: Genera suggerimenti evento server-side con fallback stagionale
      responses:
        "201": { description: Suggerimenti salvati in ai_event_suggestions }
  /organizer/opportunities/top-events:
    get:
      security: [{ bearerAuth: [] }]
      summary: Eventi di maggior successo con dati pubblici o aggregati
      responses:
        "200": { description: Feed ispirazione filtrato da show_in_inspiration_feed }
  /organizer/opportunities/{suggestion}/use:
    post:
      security: [{ bearerAuth: [] }]
      summary: Crea bozza da suggerimento senza pubblicare
      parameters:
        - { name: suggestion, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Bozza evento creata }
  /organizer/top-events/{event}/inspire:
    post:
      security: [{ bearerAuth: [] }]
      summary: Crea bozza generica ispirata a un format di successo
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Bozza generica creata senza copiare contenuti protetti }
  /organizer/campaigns:
    get:
      security: [{ bearerAuth: [] }]
      summary: Campagne tracciate
      responses:
        "200": { description: Lista campagne con statistiche }
    post:
      security: [{ bearerAuth: [] }]
      summary: Crea campagna promozionale semplice
      responses:
        "201": { description: Campagna creata }
  /organizer/calendar:
    get:
      security: [{ bearerAuth: [] }]
      summary: Vista calendario giornaliera o mensile
      responses:
        "200": { description: Esperienze con colore categoria }
  /organizer/calendar/availability:
    get:
      security: [{ bearerAuth: [] }]
      summary: Disponibilita mensile con livello empty, low o crowded
      responses:
        "200": { description: Giorni con conteggio eventi pubblici e colore logico }
  /organizer/calendar/events:
    get:
      security: [{ bearerAuth: [] }]
      summary: Eventi pubblici sintetici in una data
      responses:
        "200": { description: Titolo, categoria, ora, comune, organizer e sold out }
  /organizer/map:
    get:
      security: [{ bearerAuth: [] }]
      summary: Vista mappa esperienze vicine
      responses:
        "200": { description: Marker con categoria, luogo e distanza }
  /organizer/events:
    get:
      security: [{ bearerAuth: [] }]
      summary: Eventi del locale
      description: Lista paginata degli eventi del solo Organizer autenticato, classificata con la stessa semantica della dashboard.
      parameters:
        - name: filter
          in: query
          schema: { type: string, enum: [all, future, completed, unpublished, cancelled], default: all }
        - name: sort
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
      responses:
        "200":
          description: Lista eventi paginata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizerEventListResponse"
        "401": { description: Token assente o non valido }
        "403": { description: Ruolo Organizer o profilo approvato richiesto }
        "422": { description: Parametri di filtro o paginazione non validi }
    post:
      security: [{ bearerAuth: [] }]
      summary: Crea una bozza evento con ticket type
      description: Assegna automaticamente l'Organizer autenticato. Stato, disponibilità, prenotazioni e identificatori protetti non sono accettati dal client.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizerEventWriteRequest" }
      responses:
        "201":
          description: Bozza creata atomicamente con categorie e ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizerEventResponse" }
        "401": { description: Token assente o non valido }
        "403": { description: Ruolo Organizer o profilo approvato richiesto }
        "422": { description: Payload non valido o campo protetto presente }
  /organizer/events/{event}:
    get:
      security: [{ bearerAuth: [] }]
      summary: Carica un proprio evento per la modifica
      parameters:
        - { name: event, in: path, required: true, schema: { type: string }, description: ULID evento }
      responses:
        "200":
          description: Evento con categorie, comune e ticket; ogni ticket espone ULID e booked_quantity in sola lettura
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizerEventResponse" }
        "401": { description: Token assente o non valido }
        "403": { description: Evento appartenente a un altro Organizer }
        "404": { description: Evento non trovato }
    put:
      security: [{ bearerAuth: [] }]
      summary: Aggiorna un proprio evento modificabile preservando identità e prenotazioni dei ticket
      parameters:
        - { name: event, in: path, required: true, schema: { type: string }, description: ULID evento }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizerEventWriteRequest" }
      responses:
        "200":
          description: Evento e ticket aggiornati atomicamente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizerEventResponse" }
        "401": { description: Token assente o non valido }
        "403": { description: Evento altrui o stato non modificabile }
        "404": { description: Evento non trovato }
        "422": { description: Payload non valido, quantità sotto le prenotazioni o rimozione di ticket prenotato }
    patch:
      security: [{ bearerAuth: [] }]
      summary: Aggiorna un proprio evento usando lo stesso contratto completo della PUT
      parameters:
        - { name: event, in: path, required: true, schema: { type: string }, description: ULID evento }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizerEventWriteRequest" }
      responses:
        "200": { description: Evento e ticket aggiornati atomicamente }
        "401": { description: Token assente o non valido }
        "403": { description: Evento altrui o stato non modificabile }
        "404": { description: Evento non trovato }
        "422": { description: Payload non valido o vincolo prenotazioni violato }
  /organizer/events/{event}/publish:
    post:
      security: [{ bearerAuth: [] }]
      summary: Pubblica evento e genera notifiche ai clienti interessati
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Evento portato da draft a published e notifiche generate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizerEventResponse" }
        "401": { description: Token assente o non valido }
        "403": { description: Evento altrui o Organizer non approvato }
        "404": { description: Evento non trovato }
        "422": { description: Stato non pubblicabile o evento incompleto }
  /organizer/events/{event}/cancel:
    post:
      security: [{ bearerAuth: [] }]
      summary: Annulla un proprio evento futuro con reason_code e reason
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Evento annullato, prenotazioni chiuse e notifiche accodate }
  /organizer/events/{event}/bookings:
    get:
      security: [{ bearerAuth: [] }]
      summary: Prenotazioni ricevute dal locale
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Lista prenotazioni }
  /organizer/bookings:
    get:
      security: [{ bearerAuth: [] }]
      summary: Elenco paginato delle prenotazioni ricevute dall'Organizer
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - { name: filter, in: query, schema: { type: string, enum: [all, confirmed, checked_in, completed, cancelled], default: all } }
        - { name: sort_by, in: query, schema: { type: string, enum: [booked_at, event, customer, people, status], default: booked_at } }
        - { name: sort, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 15 } }
      responses:
        "200": { description: Prenotazioni visibili all'Organizer, con metadati di paginazione }
        "401": { description: Token assente o non valido }
        "403": { description: Ruolo non consentito o profilo Organizer non approvato }
        "422": { description: Parametri di ricerca, filtro o ordinamento non validi }
  /organizer/bookings/{booking}:
    get:
      security: [{ bearerAuth: [] }]
      summary: Dettaglio in sola lettura di una prenotazione ricevuta
      parameters:
        - { name: booking, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Cliente, evento, ticket, persone, stato, QR, note, date e check-in }
        "401": { description: Token assente o non valido }
        "403": { description: Prenotazione di un altro Organizer o ruolo non consentito }
        "404": { description: Prenotazione non trovata }
  /organizer/events/{event}/check-ins:
    post:
      security: [{ bearerAuth: [] }]
      summary: Valida una sola volta il QR di una prenotazione dell'evento
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token]
              properties:
                qr_token: { type: string, minLength: 32 }
      responses:
        "201":
          description: Check-in registrato
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [booking_ulid, booking_status, checked_in_at]
                    properties:
                      booking_ulid: { type: string }
                      booking_status: { type: string, enum: [checked_in] }
                      checked_in_at: { type: string, format: date-time }
        "404": { description: QR non valido }
        "409": { description: QR già utilizzato }
  /organizer/events/{event}/summary:
    get:
      security: [{ bearerAuth: [] }]
      summary: Riepilogo aperto/chiuso con prenotati, check-in, no-show e rating
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Summary evento proprietario }
  /organizer/events/{event}/participants:
    get:
      security: [{ bearerAuth: [] }]
      summary: Partecipanti del proprio evento
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Partecipanti e stato check-in }
  /organizer/events/{event}/reviews:
    get:
      security: [{ bearerAuth: [] }]
      summary: Recensioni del proprio evento
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Recensioni e statistiche evento }
  /organizer/reviews/events:
    get:
      security: [{ bearerAuth: [] }]
      summary: Recensioni raggruppate per evento
      responses:
        "200": { description: Lista eventi con media, conteggio, distribuzione e ultima recensione }
  /admin/dashboard:
    get:
      security: [{ bearerAuth: [] }]
      summary: Dashboard amministrativa protetta da role:admin
      responses:
        "200": { description: KPI piattaforma, organizer, eventi, sospensioni e report review }
        "403": { description: Solo admin }
  /admin/overview:
    get:
      security: [{ bearerAuth: [] }]
      summary: Console amministratore completa orientata ai dati
      responses:
        "200": { description: KPI, grafici, ultime attivita, eventi, organizzatori, clienti, recensioni, categorie, territorio, abbonamenti e audit log }
        "403": { description: Solo admin }
  /admin/events:
    get:
      security: [{ bearerAuth: [] }]
      summary: Lista completa eventi con filtri admin
      responses:
        "200": { description: Lista paginata eventi e statistiche stato }
  /admin/events/{event}:
    get:
      security: [{ bearerAuth: [] }]
      summary: Dettaglio evento admin
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Evento con prenotazioni, recensioni, ranking e annullamento }
  /admin/events/{event}/suspend:
    post:
      security: [{ bearerAuth: [] }]
      summary: Sospende o annulla in post-moderazione un evento
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Evento sospeso o annullato con notifiche se necessario }
  /admin/events/{event}/archive:
    post:
      security: [{ bearerAuth: [] }]
      summary: Archivia evento
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Evento archiviato }
  /admin/organizers:
    get:
      security: [{ bearerAuth: [] }]
      summary: Lista paginata delle richieste Organizer per moderazione Admin
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/OrganizerVerificationStatus" } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
      responses:
        "200": { description: Lista paginata con pending_count }
        "403": { description: Solo admin }
  /admin/organizers/{organizer}/approve:
    post:
      security: [{ bearerAuth: [] }]
      summary: Approva organizzatore
      parameters:
        - { name: organizer, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Organizzatore approvato }
        "409": { description: Richiesta non in revisione }
  /admin/organizers/{organizer}/request-changes:
    post:
      security: [{ bearerAuth: [] }]
      summary: Richiede integrazioni motivate all'Organizer
      parameters:
        - { name: organizer, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizerReviewReason" }
      responses:
        "200": { description: Integrazione richiesta }
        "409": { description: Richiesta non in revisione }
        "422": { description: Motivazione mancante o non valida }
  /admin/organizers/{organizer}/reject:
    post:
      security: [{ bearerAuth: [] }]
      summary: Rifiuta con motivazione la richiesta Organizer
      parameters:
        - { name: organizer, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizerReviewReason" }
      responses:
        "200": { description: Richiesta rifiutata }
        "409": { description: Richiesta non in revisione }
        "422": { description: Motivazione mancante o non valida }
  /admin/organizers/{organizer}:
    get:
      security: [{ bearerAuth: [] }]
      summary: Dettaglio organizzatore admin
      parameters:
        - { name: organizer, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Overview organizzatore }
  /admin/organizers/{organizer}/events:
    get:
      security: [{ bearerAuth: [] }]
      summary: Eventi organizzatore per admin
      parameters:
        - { name: organizer, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Eventi con conteggi }
  /admin/organizers/{organizer}/reviews:
    get:
      security: [{ bearerAuth: [] }]
      summary: Recensioni organizzatore per admin
      parameters:
        - { name: organizer, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Recensioni aggregate }
  /admin/organizers/{organizer}/bookings:
    get:
      security: [{ bearerAuth: [] }]
      summary: Prenotazioni organizzatore aggregate per evento
      parameters:
        - { name: organizer, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Booking stats }
  /admin/organizers/{organizer}/cancellations:
    get:
      security: [{ bearerAuth: [] }]
      summary: Annullamenti organizzatore
      parameters:
        - { name: organizer, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Eventi e prenotazioni annullate }
  /admin/rankings/events:
    get:
      security: [{ bearerAuth: [] }]
      summary: Classifica eventi
      responses:
        "200": { description: Creativity, participation, review e final score }
  /admin/rankings/organizers:
    get:
      security: [{ bearerAuth: [] }]
      summary: Classifica organizzatori
      responses:
        "200": { description: Eventi creati e indicatori qualitativi }
  /admin/rankings/events/{event}/breakdown:
    get:
      security: [{ bearerAuth: [] }]
      summary: Breakdown formula classifica evento
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Formula e punteggi }
  /admin/reviews/{review}/approve:
    post:
      security: [{ bearerAuth: [] }]
      summary: Approva recensione
      parameters:
        - { name: review, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Recensione approvata }
  /admin/reviews/{review}/hide:
    post:
      security: [{ bearerAuth: [] }]
      summary: Nasconde recensione
      parameters:
        - { name: review, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Recensione nascosta }
  /admin/reviews/{review}:
    delete:
      security: [{ bearerAuth: [] }]
      summary: Elimina recensione
      parameters:
        - { name: review, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Recensione eliminata }
components:
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, format: password, minLength: 8 }
        password_confirmation: { type: string, format: password, minLength: 8 }
        role: { type: string, enum: [customer, organizer], default: customer }
        organization_name:
          type: string
          maxLength: 180
          description: Obbligatorio quando role e organizer.
        organization_type:
          type: string
          maxLength: 80
          description: Obbligatorio quando role e organizer.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    AuthUser:
      type: object
      required: [name, email, role, status, organizer_profile]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [customer, organizer, admin] }
        status: { type: string, enum: [active, pending, suspended] }
        organizer_profile:
          oneOf:
            - type: "null"
            - type: object
              required: [ulid, name, verification_status]
              properties:
                ulid: { type: string }
                name: { type: string }
                verification_status: { $ref: "#/components/schemas/OrganizerVerificationStatus" }
                review_notes: { type: [string, "null"] }
    AuthResponse:
      type: object
      required: [user, token, redirect_to]
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }
        token: { type: string, description: Personal access token Sanctum opaco. }
        redirect_to: { type: string, enum: [/customer/dashboard, /organizer/onboarding, /organizer/pending, /organizer/dashboard, /organizer/rejected, /organizer/suspended, /admin/dashboard] }
    SessionResponse:
      type: object
      required: [user, redirect_to]
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }
        redirect_to: { type: string, enum: [/customer/dashboard, /organizer/onboarding, /organizer/pending, /organizer/dashboard, /organizer/rejected, /organizer/suspended, /admin/dashboard] }
    OrganizerVerificationStatus:
      type: string
      enum: [incomplete, pending, changes_requested, verified, rejected, suspended]
    OrganizerProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: [string, "null"], maxLength: 180 }
        type: { type: [string, "null"], maxLength: 80 }
        description: { type: [string, "null"], maxLength: 3000 }
        municipality_id: { type: [integer, "null"] }
        address: { type: [string, "null"], maxLength: 255 }
        street_number: { type: [string, "null"], maxLength: 20 }
        postal_code: { type: [string, "null"], pattern: "^[0-9]{5}$" }
        province: { type: [string, "null"], pattern: "^[A-Z]{2}$" }
        country: { type: [string, "null"], maxLength: 80 }
        vat_number: { type: [string, "null"], pattern: "^(IT)?[0-9]{11}$" }
        pec: { type: [string, "null"], format: email }
        sdi_code: { type: [string, "null"], pattern: "^[A-Za-z0-9]{7}$" }
        phone: { type: [string, "null"], maxLength: 40 }
        public_email: { type: [string, "null"], format: email }
        website_url: { type: [string, "null"], format: uri }
        instagram_url: { type: [string, "null"], format: uri }
        facebook_url: { type: [string, "null"], format: uri }
        tiktok_url: { type: [string, "null"], format: uri }
    OrganizerReviewReason:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 2000 }
    OrganizerEventListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            required: [event, summary]
            properties:
              event:
                type: object
                required: [ulid, title, status, starts_at, capacity_total, available_total]
                additionalProperties: true
                properties:
                  ulid: { type: string }
                  title: { type: string }
                  status: { type: string, enum: [draft, pending_review, published, sold_out, cancelled, completed, rejected, suspended, archived] }
                  starts_at: { type: string, format: date-time }
                  capacity_total: { type: integer, minimum: 0 }
                  available_total: { type: integer, minimum: 0 }
              summary:
                type: object
                required: [ulid, title, status, visual_status, starts_at, capacity_total, booked_people, available_total, checked_in_people, no_show]
                additionalProperties: true
        meta:
          type: object
          required: [current_page, last_page, per_page, total, from, to]
          properties:
            current_page: { type: integer, minimum: 1 }
            last_page: { type: integer, minimum: 1 }
            per_page: { type: integer, minimum: 1, maximum: 50 }
            total: { type: integer, minimum: 0 }
            from: { type: [integer, "null"], minimum: 1 }
            to: { type: [integer, "null"], minimum: 1 }
    OrganizerEventTicketWrite:
      type: object
      required: [name, audience, price_cents, max_quantity]
      properties:
        ulid:
          type: string
          description: Presente soltanto per un ticket esistente durante l'update; deve appartenere all'evento.
        name: { type: string, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 500 }
        audience: { type: string, enum: [adult, child, generic] }
        price_cents: { type: integer, minimum: 0 }
        max_quantity: { type: integer, minimum: 1, maximum: 10000 }
        is_active: { type: boolean, default: true }
    OrganizerEventWriteRequest:
      type: object
      required: [title, summary, description, municipality_id, category_ids, starts_at, capacity_total, is_free, family_friendly, indoor_outdoor]
      properties:
        title: { type: string, maxLength: 180 }
        summary: { type: string, maxLength: 280 }
        description: { type: string, maxLength: 8000 }
        municipality_id: { type: integer }
        category_ids:
          type: array
          minItems: 1
          items: { type: integer }
        starts_at: { type: string, format: date-time, description: Deve essere futura. }
        ends_at: { type: [string, "null"], format: date-time, description: Se presente deve essere successiva a starts_at. }
        booking_closes_at: { type: [string, "null"], format: date-time }
        capacity_total: { type: integer, minimum: 1, maximum: 10000 }
        is_free: { type: boolean }
        price_notes: { type: [string, "null"], maxLength: 500 }
        family_friendly: { type: boolean }
        indoor_outdoor: { type: string, enum: [indoor, outdoor, mixed] }
        ticket_types:
          type: array
          minItems: 1
          description: Se omesso in update, i ticket esistenti restano invariati. Un ticket omesso viene rimosso solo se booked_quantity è zero.
          items: { $ref: "#/components/schemas/OrganizerEventTicketWrite" }
    OrganizerEventTicket:
      allOf:
        - $ref: "#/components/schemas/OrganizerEventTicketWrite"
        - type: object
          required: [ulid, booked_quantity]
          properties:
            ulid: { type: string }
            booked_quantity: { type: integer, minimum: 0, readOnly: true }
    OrganizerEventResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [ulid, title, summary, description, status, starts_at, capacity_total, available_total, categories, ticket_types]
          additionalProperties: true
          properties:
            ulid: { type: string }
            title: { type: string }
            summary: { type: string }
            description: { type: string }
            status: { type: string, enum: [draft, pending_review, published, sold_out, cancelled, completed, rejected, suspended, archived] }
            starts_at: { type: string, format: date-time }
            ends_at: { type: [string, "null"], format: date-time }
            capacity_total: { type: integer, minimum: 1 }
            available_total: { type: integer, minimum: 0 }
            categories:
              type: array
              items: { type: object, additionalProperties: true }
            ticket_types:
              type: array
              items: { $ref: "#/components/schemas/OrganizerEventTicket" }
    OrganizerDashboardResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/OrganizerDashboardData"
    OrganizerDashboardData:
      type: object
      required: [subscription, bi, category_performance, active_experiences, future_experiences, completed_experiences, unpublished_experiences, bookings_total, available_places, participants_total, views_total, favorites_received, followers, reviews]
      properties:
        subscription:
          type: [object, "null"]
          description: Abbonamento Organizer con piano e funzionalita, oppure null.
          additionalProperties: true
        bi:
          $ref: "#/components/schemas/OrganizerDashboardBi"
        category_performance:
          type: array
          items:
            $ref: "#/components/schemas/OrganizerCategoryPerformance"
        active_experiences:
          type: integer
          minimum: 0
          description: Eventi operativi futuri; coincide con future_experiences.
        future_experiences: { type: integer, minimum: 0 }
        completed_experiences: { type: integer, minimum: 0 }
        unpublished_experiences: { type: integer, minimum: 0 }
        bookings_total:
          type: integer
          minimum: 0
          description: Booking valide ricevute; coincide con bi.bookings_received.
        available_places: { type: integer, minimum: 0 }
        participants_total:
          type: integer
          minimum: 0
          description: Somma di total_people delle booking valide.
        views_total: { type: integer, minimum: 0 }
        favorites_received: { type: integer, minimum: 0 }
        followers: { type: integer, minimum: 0 }
        reviews: { type: integer, minimum: 0 }
    OrganizerDashboardBi:
      type: object
      required: [published_events, future_events, completed_events, unpublished_events, cancelled_events, sold_out_events, available_places, occupied_places, bookings_received, participants_total, unique_participants, returning_participants, returning_rate, new_customers_rate, followers_total, new_followers, reviews, average_rating, review_analytics, views_total]
      properties:
        published_events: { type: integer, minimum: 0 }
        future_events:
          type: integer
          minimum: 0
          description: Eventi published o sold_out con starts_at maggiore o uguale a now.
        completed_events:
          type: integer
          minimum: 0
          description: Eventi con status completed.
        unpublished_events:
          type: integer
          minimum: 0
          description: Eventi draft, pending_review, rejected, suspended o archived.
        cancelled_events: { type: integer, minimum: 0 }
        sold_out_events: { type: integer, minimum: 0 }
        available_places:
          type: integer
          minimum: 0
          description: Posti disponibili degli eventi operativi futuri.
        occupied_places:
          type: integer
          minimum: 0
          description: Capacita meno disponibilita degli eventi operativi futuri.
        bookings_received:
          type: integer
          minimum: 0
          description: Booking confirmed, checked_in o completed ricevute.
        participants_total:
          type: integer
          minimum: 0
          description: Somma di bookings.total_people delle booking valide.
        unique_participants: { type: integer, minimum: 0 }
        returning_participants: { type: integer, minimum: 0 }
        returning_rate: { type: number, minimum: 0, maximum: 100 }
        new_customers_rate: { type: number, minimum: 0, maximum: 100 }
        followers_total: { type: integer, minimum: 0 }
        new_followers: { type: integer, minimum: 0 }
        reviews: { type: integer, minimum: 0 }
        average_rating: { type: [number, "null"] }
        review_analytics:
          $ref: "#/components/schemas/OrganizerReviewAnalytics"
        views_total: { type: integer, minimum: 0 }
    OrganizerReviewAnalytics:
      type: object
      required: [average_rating, reviews_count, satisfied_rate, recommendation_rate, trend, best_categories]
      properties:
        average_rating: { type: [number, "null"] }
        reviews_count: { type: integer, minimum: 0 }
        satisfied_rate: { type: number, minimum: 0, maximum: 100 }
        recommendation_rate: { type: number, minimum: 0, maximum: 100 }
        trend:
          type: array
          items:
            type: object
            required: [day, reviews_count, average_rating]
            properties:
              day: { type: string, format: date }
              reviews_count: { type: integer, minimum: 0 }
              average_rating: { type: number }
        best_categories:
          type: array
          items:
            type: object
            required: [name, reviews_count, average_rating]
            properties:
              name: { type: string }
              reviews_count: { type: integer, minimum: 0 }
              average_rating: { type: number }
    OrganizerCategoryPerformance:
      type: object
      required: [name, events_count, bookings_count, avg_participants, fill_rate]
      properties:
        name: { type: string }
        events_count: { type: integer, minimum: 0 }
        bookings_count: { type: integer, minimum: 0 }
        avg_participants: { type: number, minimum: 0 }
        fill_rate: { type: number, minimum: 0 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Personal access token opaco emesso da Laravel Sanctum. Non è un JWT.

openapi: 3.1.0
info:
  title: Eventi Locali API
  version: 0.2.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /auth/register:
    post:
      summary: Registra customer o organizer
      responses:
        "201": { description: Utente creato }
  /auth/login:
    post:
      summary: Login e token Sanctum con role e redirect_to
      responses:
        "200": { description: Token creato con user.role e redirect_to }
  /categories:
    get:
      summary: Macroaree evento
      responses:
        "200": { description: Lista categorie }
  /events:
    get:
      summary: Eventi pubblicati
      parameters:
        - { name: q, in: query, description: Ricerca case-insensitive in titolo e descrizione, schema: { type: string, maxLength: 200 } }
        - { name: category_id, in: query, schema: { type: integer } }
        - { name: province_id, in: query, schema: { type: integer } }
        - { name: municipality_id, in: query, schema: { type: integer } }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: free, in: query, schema: { type: boolean } }
        - { name: available, in: query, schema: { type: boolean } }
      responses:
        "200": { description: Lista paginata }
  /events/{event}:
    get:
      summary: Dettaglio evento pubblicato
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Evento }
  /events/{event}/reviews:
    get:
      summary: Recensioni approvate e statistiche evento
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Lista paginata con statistiche recensioni }
    post:
      security: [{ bearerAuth: [] }]
      summary: Crea recensione da prenotazione confermata e partecipata
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Recensione creata }
        "403": { description: Prenotazione/partecipazione mancante o organizer proprietario }
        "422": { description: Recensione duplicata o payload non valido }
  /reviews/{review}/report:
    post:
      security: [{ bearerAuth: [] }]
      summary: Segnala una recensione
      parameters:
        - { name: review, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Segnalazione aperta }
  /subscription-plans:
    get:
      summary: Piani SaaS disponibili per organizzatori
      responses:
        "200": { description: Lista piani con feature }
  /organizers/{organizer}:
    get:
      summary: Profilo pubblico organizzatore con esperienze future e concluse
      parameters:
        - { name: organizer, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Profilo pubblico }
  /organizers/{organizer}/follow:
    post:
      security: [{ bearerAuth: [] }]
      summary: Segui organizzatore
      parameters:
        - { name: organizer, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Organizzatore seguito }
    delete:
      security: [{ bearerAuth: [] }]
      summary: Smetti di seguire organizzatore
      parameters:
        - { name: organizer, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Follow rimosso }
  /me/preferences:
    get:
      security: [{ bearerAuth: [] }]
      summary: Preferenze macroarea del cliente
      responses:
        "200": { description: Preferenze }
    put:
      security: [{ bearerAuth: [] }]
      summary: Aggiorna preferenze macroarea
      responses:
        "200": { description: Preferenze aggiornate }
  /customer/dashboard:
    get:
      security: [{ bearerAuth: [] }]
      summary: Dashboard cliente protetta da role:customer
      responses:
        "200": { description: Eventi di successo, eventi futuri, consigliati, booking, preferiti e notifiche }
        "403": { description: Ruolo non autorizzato }
  /customer/successful-events:
    get:
      security: [{ bearerAuth: [] }]
      summary: Eventi di Successo per customer
      parameters:
        - { name: category_id, in: query, schema: { type: integer } }
        - { name: province_id, in: query, schema: { type: integer } }
        - { name: municipality_id, in: query, schema: { type: integer } }
        - { name: min_rating, in: query, schema: { type: number } }
        - { name: organizer_id, in: query, schema: { type: integer } }
        - { name: has_next_edition, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [score, recent, rating, fill_rate, recommended, next_edition] } }
        - { name: per_page, in: query, schema: { type: integer } }
      responses:
        "200": { description: Lista eventi conclusi con dati pubblici e aggregati }
        "403": { description: Solo customer }
  /customer/successful-events/{event}:
    get:
      security: [{ bearerAuth: [] }]
      summary: Dettaglio pubblico aggregato di un evento concluso di successo
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Dettaglio con recensioni pubbliche, nuova edizione e simili }
        "404": { description: Evento non ammesso al feed }
  /customer/successful-events/{event}/next-editions:
    get:
      security: [{ bearerAuth: [] }]
      summary: Nuove edizioni future collegate via event_series
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Edizioni future prenotabili se pubblicate }
  /customer/successful-events/{event}/similar:
    get:
      security: [{ bearerAuth: [] }]
      summary: Eventi futuri simili per categoria e territorio
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Eventi simili deterministici }
  /customer/successful-events/{event}/notify-similar:
    post:
      security: [{ bearerAuth: [] }]
      summary: Attiva notifiche per format simili
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Preferenza salvata in customer_event_format_interests }
    delete:
      security: [{ bearerAuth: [] }]
      summary: Disattiva notifiche per format simili
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Preferenza rimossa }
  /me/favorites:
    get:
      security: [{ bearerAuth: [] }]
      summary: Preferiti cliente
      responses:
        "200": { description: Lista preferiti }
        "403": { description: Solo customer }
  /me/favorites/{event}:
    post:
      security: [{ bearerAuth: [] }]
      summary: Salva evento tra i preferiti
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Preferito creato }
        "403": { description: Solo customer }
    delete:
      security: [{ bearerAuth: [] }]
      summary: Rimuovi evento dai preferiti
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Preferito rimosso }
        "403": { description: Solo customer }
  /me/notification-preferences:
    get:
      security: [{ bearerAuth: [] }]
      summary: Preferenze notifica
      responses:
        "200": { description: Preferenze notifica }
    put:
      security: [{ bearerAuth: [] }]
      summary: Aggiorna preferenze notifica
      responses:
        "200": { description: Preferenze aggiornate }
  /events/{event}/bookings:
    post:
      security: [{ bearerAuth: [] }]
      summary: Prenota posti per un evento
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      responses:
        "201": { description: Prenotazione confermata }
        "422": { description: Posti non disponibili o richiesta non valida }
  /me/bookings:
    get:
      security: [{ bearerAuth: [] }]
      summary: Prenotazioni del cliente
      responses:
        "200": { description: Lista prenotazioni }
  /me/bookings/{booking}:
    get:
      security: [{ bearerAuth: [] }]
      summary: Dettaglio prenotazione cliente
      parameters:
        - { name: booking, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Prenotazione }
        "403": { description: Prenotazione altrui }
  /me/bookings/{booking}/cancel:
    post:
      security: [{ bearerAuth: [] }]
      summary: Annulla prenotazione e libera posti
      parameters:
        - { name: booking, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Prenotazione annullata }
  /me/notifications:
    get:
      security: [{ bearerAuth: [] }]
      summary: Centro notifiche
      responses:
        "200": { description: Lista notifiche }
  /me/notifications/{notification}/read:
    post:
      security: [{ bearerAuth: [] }]
      summary: Marca una notifica come letta
      parameters:
        - { name: notification, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Notifica letta }
  /me/notifications/read-all:
    post:
      security: [{ bearerAuth: [] }]
      summary: Marca tutte le notifiche come lette
      responses:
        "200": { description: Notifiche lette }
  /organizer/profile:
    get:
      security: [{ bearerAuth: [] }]
      summary: Profilo locale
      responses:
        "200": { description: Profilo }
    post:
      security: [{ bearerAuth: [] }]
      summary: Crea profilo locale
      responses:
        "201": { description: Profilo creato }
    put:
      security: [{ bearerAuth: [] }]
      summary: Aggiorna profilo locale
      responses:
        "200": { description: Profilo aggiornato }
  /organizer/dashboard:
    get:
      security: [{ bearerAuth: [] }]
      summary: Dashboard SaaS organizzatore protetta da role:organizer e organizer.approved
      responses:
        "200": { description: KPI subscription, esperienze, prenotazioni, follower e views }
        "403": { description: Organizer non approvato o ruolo errato }
  /organizer/reviews:
    get:
      security: [{ bearerAuth: [] }]
      summary: Recensioni del profilo organizzatore
      responses:
        "200": { description: Statistiche, distribuzione stelle, recensioni recenti, migliori e critiche }
  /organizer/statistics:
    get:
      security: [{ bearerAuth: [] }]
      summary: KPI business intelligence organizzatore
      responses:
        "200": { description: KPI e performance categorie }
  /organizer/analytics:
    get:
      security: [{ bearerAuth: [] }]
      summary: Eventi analytics recenti
      responses:
        "200": { description: Lista analytics events }
  /organizer/followers:
    get:
      security: [{ bearerAuth: [] }]
      summary: Utenti che seguono il locale
      responses:
        "200": { description: Lista follower }
  /organizer/categories:
    get:
      security: [{ bearerAuth: [] }]
      summary: Performance categorie
      responses:
        "200": { description: Categoria, eventi, prenotazioni, fill rate }
  /organizer/opportunities:
    get:
      security: [{ bearerAuth: [] }]
      summary: Organizer Opportunity Engine
      responses:
        "200": { description: Concorrenza, suggerimenti AI/fallback e top events aggregati }
  /organizer/opportunities/generate:
    post:
      security: [{ bearerAuth: [] }]
      summary: Genera suggerimenti evento server-side con fallback stagionale
      responses:
        "201": { description: Suggerimenti salvati in ai_event_suggestions }
  /organizer/opportunities/top-events:
    get:
      security: [{ bearerAuth: [] }]
      summary: Eventi di maggior successo con dati pubblici o aggregati
      responses:
        "200": { description: Feed ispirazione filtrato da show_in_inspiration_feed }
  /organizer/opportunities/{suggestion}/use:
    post:
      security: [{ bearerAuth: [] }]
      summary: Crea bozza da suggerimento senza pubblicare
      parameters:
        - { name: suggestion, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Bozza evento creata }
  /organizer/top-events/{event}/inspire:
    post:
      security: [{ bearerAuth: [] }]
      summary: Crea bozza generica ispirata a un format di successo
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Bozza generica creata senza copiare contenuti protetti }
  /organizer/campaigns:
    get:
      security: [{ bearerAuth: [] }]
      summary: Campagne tracciate
      responses:
        "200": { description: Lista campagne con statistiche }
    post:
      security: [{ bearerAuth: [] }]
      summary: Crea campagna promozionale semplice
      responses:
        "201": { description: Campagna creata }
  /organizer/calendar:
    get:
      security: [{ bearerAuth: [] }]
      summary: Vista calendario giornaliera o mensile
      responses:
        "200": { description: Esperienze con colore categoria }
  /organizer/calendar/availability:
    get:
      security: [{ bearerAuth: [] }]
      summary: Disponibilita mensile con livello empty, low o crowded
      responses:
        "200": { description: Giorni con conteggio eventi pubblici e colore logico }
  /organizer/calendar/events:
    get:
      security: [{ bearerAuth: [] }]
      summary: Eventi pubblici sintetici in una data
      responses:
        "200": { description: Titolo, categoria, ora, comune, organizer e sold out }
  /organizer/map:
    get:
      security: [{ bearerAuth: [] }]
      summary: Vista mappa esperienze vicine
      responses:
        "200": { description: Marker con categoria, luogo e distanza }
  /organizer/events:
    get:
      security: [{ bearerAuth: [] }]
      summary: Eventi del locale
      responses:
        "200": { description: Lista eventi }
    post:
      security: [{ bearerAuth: [] }]
      summary: Crea evento con ticket type
      responses:
        "201": { description: Evento creato }
  /organizer/events/{event}/publish:
    post:
      security: [{ bearerAuth: [] }]
      summary: Pubblica evento e genera notifiche ai clienti interessati
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Evento pubblicato }
  /organizer/events/{event}/cancel:
    post:
      security: [{ bearerAuth: [] }]
      summary: Annulla un proprio evento futuro con reason_code e reason
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Evento annullato, prenotazioni chiuse e notifiche accodate }
  /organizer/events/{event}/bookings:
    get:
      security: [{ bearerAuth: [] }]
      summary: Prenotazioni ricevute dal locale
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Lista prenotazioni }
  /organizer/events/{event}/check-ins:
    post:
      security: [{ bearerAuth: [] }]
      summary: Valida una sola volta il QR di una prenotazione dell'evento
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token]
              properties:
                qr_token: { type: string, minLength: 32 }
      responses:
        "201":
          description: Check-in registrato
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [booking_ulid, booking_status, checked_in_at]
                    properties:
                      booking_ulid: { type: string }
                      booking_status: { type: string, enum: [checked_in] }
                      checked_in_at: { type: string, format: date-time }
        "404": { description: QR non valido }
        "409": { description: QR già utilizzato }
  /organizer/events/{event}/summary:
    get:
      security: [{ bearerAuth: [] }]
      summary: Riepilogo aperto/chiuso con prenotati, check-in, no-show e rating
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Summary evento proprietario }
  /organizer/events/{event}/participants:
    get:
      security: [{ bearerAuth: [] }]
      summary: Partecipanti del proprio evento
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Partecipanti e stato check-in }
  /organizer/events/{event}/reviews:
    get:
      security: [{ bearerAuth: [] }]
      summary: Recensioni del proprio evento
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Recensioni e statistiche evento }
  /organizer/reviews/events:
    get:
      security: [{ bearerAuth: [] }]
      summary: Recensioni raggruppate per evento
      responses:
        "200": { description: Lista eventi con media, conteggio, distribuzione e ultima recensione }
  /admin/dashboard:
    get:
      security: [{ bearerAuth: [] }]
      summary: Dashboard amministrativa protetta da role:admin
      responses:
        "200": { description: KPI piattaforma, organizer, eventi, sospensioni e report review }
        "403": { description: Solo admin }
  /admin/overview:
    get:
      security: [{ bearerAuth: [] }]
      summary: Console amministratore completa orientata ai dati
      responses:
        "200": { description: KPI, grafici, ultime attivita, eventi, organizzatori, clienti, recensioni, categorie, territorio, abbonamenti e audit log }
        "403": { description: Solo admin }
  /admin/events:
    get:
      security: [{ bearerAuth: [] }]
      summary: Lista completa eventi con filtri admin
      responses:
        "200": { description: Lista paginata eventi e statistiche stato }
  /admin/events/{event}:
    get:
      security: [{ bearerAuth: [] }]
      summary: Dettaglio evento admin
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Evento con prenotazioni, recensioni, ranking e annullamento }
  /admin/events/{event}/suspend:
    post:
      security: [{ bearerAuth: [] }]
      summary: Sospende o annulla in post-moderazione un evento
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Evento sospeso o annullato con notifiche se necessario }
  /admin/events/{event}/archive:
    post:
      security: [{ bearerAuth: [] }]
      summary: Archivia evento
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Evento archiviato }
  /admin/organizers:
    get:
      security: [{ bearerAuth: [] }]
      summary: Lista organizzatori per moderazione admin
      responses:
        "200": { description: Lista organizzatori }
        "403": { description: Solo admin }
  /admin/organizers/pending:
    get:
      security: [{ bearerAuth: [] }]
      summary: Organizzatori da verificare
      responses:
        "200": { description: Lista organizzatori }
  /admin/organizers/{organizer}/approve:
    post:
      security: [{ bearerAuth: [] }]
      summary: Approva organizzatore
      parameters:
        - { name: organizer, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Organizzatore approvato }
  /admin/organizers/{organizer}:
    get:
      security: [{ bearerAuth: [] }]
      summary: Dettaglio organizzatore admin
      parameters:
        - { name: organizer, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Overview organizzatore }
  /admin/organizers/{organizer}/events:
    get:
      security: [{ bearerAuth: [] }]
      summary: Eventi organizzatore per admin
      parameters:
        - { name: organizer, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Eventi con conteggi }
  /admin/organizers/{organizer}/reviews:
    get:
      security: [{ bearerAuth: [] }]
      summary: Recensioni organizzatore per admin
      parameters:
        - { name: organizer, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Recensioni aggregate }
  /admin/organizers/{organizer}/bookings:
    get:
      security: [{ bearerAuth: [] }]
      summary: Prenotazioni organizzatore aggregate per evento
      parameters:
        - { name: organizer, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Booking stats }
  /admin/organizers/{organizer}/cancellations:
    get:
      security: [{ bearerAuth: [] }]
      summary: Annullamenti organizzatore
      parameters:
        - { name: organizer, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Eventi e prenotazioni annullate }
  /admin/rankings/events:
    get:
      security: [{ bearerAuth: [] }]
      summary: Classifica eventi
      responses:
        "200": { description: Creativity, participation, review e final score }
  /admin/rankings/organizers:
    get:
      security: [{ bearerAuth: [] }]
      summary: Classifica organizzatori
      responses:
        "200": { description: Eventi creati e indicatori qualitativi }
  /admin/rankings/events/{event}/breakdown:
    get:
      security: [{ bearerAuth: [] }]
      summary: Breakdown formula classifica evento
      parameters:
        - { name: event, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Formula e punteggi }
  /admin/reviews/{review}/approve:
    post:
      security: [{ bearerAuth: [] }]
      summary: Approva recensione
      parameters:
        - { name: review, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Recensione approvata }
  /admin/reviews/{review}/hide:
    post:
      security: [{ bearerAuth: [] }]
      summary: Nasconde recensione
      parameters:
        - { name: review, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Recensione nascosta }
  /admin/reviews/{review}:
    delete:
      security: [{ bearerAuth: [] }]
      summary: Elimina recensione
      parameters:
        - { name: review, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Recensione eliminata }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Personal access token opaco emesso da Laravel Sanctum. Non è un JWT.

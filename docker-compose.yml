services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: >
      sh -c "test -f .env || cp .env.example .env;
      composer install --no-interaction --prefer-dist;
      php artisan key:generate --force;
      php-fpm"
    volumes:
      - ./backend:/var/www/html
      - ./frontend:/var/www/frontend:ro
    environment:
      APP_ENV: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: eventi
      DB_USERNAME: eventi
      DB_PASSWORD: eventi
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment >/dev/null || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 20

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eventi
      POSTGRES_USER: eventi
      POSTGRES_PASSWORD: eventi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-testing-db.sql:/docker-entrypoint-initdb.d/10-init-testing-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventi -d eventi"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:

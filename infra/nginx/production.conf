server { listen 80; server_name _; client_max_body_size 6m; root /var/www/html/public; index index.php;
 add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always;
 location /storage/ { alias /var/www/html/storage/app/public/; try_files $uri =404; }
 location / { try_files $uri $uri/ /index.php?$query_string; }
 location ~ \.php$ { try_files $uri =404; fastcgi_pass app:9000; include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_param HTTP_PROXY ""; }
 location ~ /\.(?!well-known).* { deny all; }
}
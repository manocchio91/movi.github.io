; Ottimizzazioni locali per l'ambiente Docker (Windows + bind mount).
;
; Il bind mount di Docker Desktop su Windows rende molto costoso ogni stat() su
; file: con validate_timestamps=1 (predefinito) opcache controlla il timestamp
; di tutti i file in cache a ogni richiesta, e con oltre 600 file di classi
; questo domina il tempo di risposta.
;
; revalidate_freq=2 mantiene il reload a caldo del codice (entro 2 secondi)
; riducendo i controlli ad un decimo, senza disattivarli.

opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.save_comments=1
opcache.enable_cli=0
